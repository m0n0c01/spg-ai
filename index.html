<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>spg-ai ルーレット</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100svh;
      background: #eeeeee;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Hiragino Sans", "Yu Gothic", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: min(92vw, 420px);
      text-align: center;
    }

    .wheel-area {
      position: relative;
      width: min(82vw, 340px);
      height: min(82vw, 340px);
      margin: 0 auto;
    }

    .pointer {
      position: absolute;
      z-index: 5;
      left: 50%;
      top: -5px;
      transform: translateX(-50%);

      width: 0;
      height: 0;

      border-left: 17px solid transparent;
      border-right: 17px solid transparent;
      border-top: 32px solid #e53935;
    }

    .wheel {
      position: relative;

      width: 100%;
      height: 100%;

      border: 6px solid #222;
      border-radius: 50%;

      overflow: hidden;

      transform: rotate(0deg);

      transition:
        transform 3s cubic-bezier(.12, .72, .15, 1);

      background: #f5d34f;
    }

    .half {
      position: absolute;

      left: 0;
      width: 100%;
      height: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: clamp(54px, 18vw, 82px);
      font-weight: 800;
    }

    .one {
      top: 0;

      background: #f5d34f;
      color: #222;
    }

    .two {
      bottom: 0;

      background: #5c8fe8;
      color: white;
    }

    .hub {
      position: absolute;

      z-index: 3;

      left: 50%;
      top: 50%;

      width: 34px;
      height: 34px;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background: #222;
      border: 5px solid white;
    }

    button {
      width: 100%;
      height: 60px;

      margin-top: 24px;

      border: 0;
      border-radius: 14px;

      background: #222;
      color: white;

      font-size: 20px;
      font-weight: 700;
    }

    button:active {
      transform: scale(.98);
    }

    #result {
      margin-top: 18px;

      font-size: 56px;
      line-height: 1;
      font-weight: 800;
    }

    #message {
      margin-top: 10px;

      height: 24px;

      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="wheel-area">

      <div class="pointer"></div>

      <div class="wheel" id="wheel">

        <div class="half one">
          1
        </div>

        <div class="half two">
          2
        </div>

        <div class="hub"></div>

      </div>

    </div>

    <button id="spinButton">
      回す
    </button>

    <div id="result">
      -
    </div>

    <div id="message">
      ボタンを押すとルーレットが回ります
    </div>

  </div>


  <script>

    const wheel =
      document.getElementById("wheel");

    const button =
      document.getElementById("spinButton");

    const result =
      document.getElementById("result");

    const message =
      document.getElementById("message");


    let angle = 0;

    let spinning = false;


    button.addEventListener("click", function () {

      if (spinning) {
        return;
      }


      spinning = true;

      button.textContent = "回転中";

      result.textContent = "…";

      message.textContent = "回転しています";


      // 4〜7回転
      const turns =
        4 + Math.floor(Math.random() * 4);


      // 最後の停止角度
      const randomAngle =
        Math.floor(Math.random() * 360);


      angle +=
        turns * 360 +
        randomAngle;


      wheel.style.transform =
        "rotate(" + angle + "deg)";

    });


    wheel.addEventListener(
      "transitionend",
      function () {

        const normalized =
          ((270 - angle) % 360 + 360) % 360;


        let value;


        if (normalized > 180) {
          value = 1;
        } else {
          value = 2;
        }


        result.textContent =
          value;

        message.textContent =
          "停止";

        button.textContent =
          "回す";

        spinning = false;

      }
    );

  </script>

</body>
</html>
