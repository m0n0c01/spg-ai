<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>spg-ai</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100svh;

      background: #eeeeee;

      color: #222;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Sans",
        "Yu Gothic",
        sans-serif;

    }


    .app {

      width: min(92vw, 500px);

      margin: 0 auto;

      padding: 40px 0;

    }


    h1 {

      text-align: center;

      font-size: 36px;

      margin: 0;

    }


    .subtitle {

      text-align: center;

      color: #777;

      margin-top: 8px;

      margin-bottom: 35px;

    }


    #games {

      display: flex;

      flex-direction: column;

      gap: 12px;

    }


    .game {

      display: block;

      width: 100%;

      padding: 20px;

      background: white;

      border: 1px solid #ddd;

      border-radius: 14px;

      color: #222;

      text-decoration: none;

      font-size: 19px;

      font-weight: 700;

      box-shadow:
        0 2px 5px rgba(0,0,0,0.08);

    }


    .game:active {

      transform: scale(.98);

    }


    .filename {

      display: block;

      margin-top: 5px;

      color: #888;

      font-size: 12px;

      font-weight: 400;

    }


    .message {

      text-align: center;

      color: #777;

      padding: 30px 0;

    }

  </style>

</head>


<body>


  <div class="app">


    <h1>
      spg-ai
    </h1>


    <div class="subtitle">
      スマホで作るゲームツール
    </div>


    <div id="games">

      <div class="message">
        ゲーム一覧を読み込んでいます…
      </div>

    </div>


  </div>


  <script>


    const games =
      document.getElementById("games");


    const repository =
      "m0n0c01/spg-ai";


    const apiURL =
      "https://api.github.com/repos/"
      + repository
      + "/contents/";


    fetch(apiURL)


      .then(function(response) {

        if (!response.ok) {

          throw new Error(
            "GitHub API error"
          );

        }

        return response.json();

      })


      .then(function(files) {


        games.innerHTML = "";


        const htmlFiles =
          files.filter(function(file) {

            return (
              file.type === "file" &&
              file.name.toLowerCase().endsWith(".html") &&
              file.name.toLowerCase() !== "index.html"
            );

          });


        if (htmlFiles.length === 0) {

          games.innerHTML =
            '<div class="message">' +
            'まだゲームがありません' +
            '</div>';

          return;

        }


        htmlFiles.forEach(function(file) {


          const link =
            document.createElement("a");


          link.className =
            "game";


          link.href =
            "./" + encodeURIComponent(file.name);


          /*
           * ファイル名から拡張子を取り除いて
           * メニューに表示する。
           */
          const title =
            file.name.replace(
              /\.html$/i,
              ""
            );


          link.textContent =
            title;


          const filename =
            document.createElement("span");


          filename.className =
            "filename";


          filename.textContent =
            file.name;


          link.appendChild(filename);


          games.appendChild(link);

        });


      })


      .catch(function(error) {


        console.error(error);


        games.innerHTML =

          '<div class="message">' +

          'ゲーム一覧を取得できませんでした。' +

          '<br><br>' +

          'ページを再読み込みしてください。' +

          '</div>';

      });


  </script>


</body>

</html>
